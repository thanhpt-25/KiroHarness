# Networked MCP integration suite. Manual or weekly only; never a required check.
# Spec: .kiro/specs/agent-harness-platform/requirements.md, Requirement 2.4.
name: integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  mcp:
    name: MCP servers
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.8.0
      - name: MCP integration tests
        env:
          HARNESS_INTEGRATION: "1"
        run: python3 -m unittest -v tests.integration.test_mcp_servers
