# Offline checks on every push and pull request.
# Spec: .kiro/specs/agent-harness-platform/requirements.md, Requirement 2.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted runner on Neo's Mac: GitHub-hosted jobs are blocked by an account billing problem.
        # Restore [ubuntu-latest, macos-latest] once billing is fixed.
        os: [self-hosted]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-python cannot install into /Users/runner on a self-hosted Mac, so the runner's own python3 (3.10+) is used.
      - name: Config validator and unit tests
        run: sh scripts/validate.sh
      - name: Property tests (ci profile)
        env:
          HYPOTHESIS_PROFILE: ci
        run: sh scripts/test-properties.sh
      - name: Coverage gate (90 percent line, 80 percent branch)
        run: |
          python3 -m venv build/ci-venv
          build/ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          PATH="$PWD/build/ci-venv/bin:$PATH" sh scripts/coverage.sh
