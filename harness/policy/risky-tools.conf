# Risky_Tool_List, read by risky-tool-guard.sh on PreToolUse.
# Line format:  <tool> | <reason> | <match>
#   <tool>   category:<name>   every Agent's tools in that Tool_Category
#                              (shell, read, write, delete, web, mcp, spec, other)
#            <agent>:<tool-id> one Agent's native tool ID, e.g. claude-code:mcp__git__git_reset
#            <tool-id>         a Kiro tool ID (MCP tools use @<server>/<tool>)
#   <reason> shown to you when Kiro asks for confirmation
#   <match>  *                                      any arguments
#            regex <field> <python-regex>           re.search on tool_input.<field>
#            host-not-in <field> <host> [<host>...] URL host not in the list (subdomains allowed)
# Lines are split on the first two " | ", so a regex may contain "|".
# Every entry needs an "# example: <json tool_input>" comment on the line
# directly above it. The tests use it as a call that must match the entry.
# Every Kiro tool an entry applies to must also appear in the matcher of
# .kiro/hooks/risky-tool-guard.json; the validator checks this.
# Run scripts/validate.sh after changing this file.

# example: {"targetFile": "src/old_module.py"}
category:delete | File deletion | *

# example: {"url": "https://example.com/data.json"}
category:web | Network fetch to a host not on the allowlist | host-not-in url @egress-allowlist.txt

# example: {"command": "cdk deploy --all"}
category:shell | Deploy or publish command | regex command (?i)\b(cdk deploy|sam deploy|terraform apply|serverless deploy|kubectl apply|helm (install|upgrade)|npm publish|twine upload)\b

# example: {"command": "rm build/output.log"}
category:shell | Shell file deletion | regex command (?i)(^|[;&|\s])rm\s

# example: {"command": "Remove-Item build -Recurse"}
category:shell | PowerShell file deletion | regex command (?i)\b(Remove-Item|del|rd|rmdir)\b

# example: {"repo_path": ".", "mode": "hard"}
@git/git_reset | Git history change through MCP | *

# example: {"repo_path": ".", "message": "wip"}
@git/git_commit | Git commit through MCP | *

# example: {"repo_path": ".", "branch_name": "main"}
@git/git_checkout | Git checkout through MCP | *

# example: {"repo_path": ".", "mode": "hard"}
claude-code:mcp__git__git_reset | Git history change through MCP | *

# example: {"repo_path": ".", "message": "wip"}
claude-code:mcp__git__git_commit | Git commit through MCP | *

# example: {"repo_path": ".", "branch_name": "main"}
claude-code:mcp__git__git_checkout | Git checkout through MCP | *
