# Quality_Hook configuration, read by quality-on-save.sh.
# The source-file extension list lives only in the "matcher" of
# .kiro/hooks/quality-on-save.json; this file does not repeat it.
#
# TEST_FILE_REGEX selects saved files that are also run as tests (Python re
# syntax, searched against the workspace-relative path). Default: test_*.py,
# *_test.go, *.test.js/ts/jsx/tsx, *.spec.js/ts/jsx/tsx.
TEST_FILE_REGEX="(^|/)(test_[^/]+\.py|[^/]+_test\.go|[^/]+\.(test|spec)\.[jt]sx?)$"
