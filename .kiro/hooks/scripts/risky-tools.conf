# Risky_Tool_List, read by risky-tool-guard.sh on PreToolUse.
# Line format:  <tool> | <reason> | <match>
#   <tool>   exact Kiro tool ID (MCP tools use @<server>/<tool>)
#   <reason> shown to you when Kiro asks for confirmation
#   <match>  *                                      any arguments
#            regex <field> <python-regex>           re.search on tool_input.<field>
#            host-not-in <field> <host> [<host>...] URL host not in the list (subdomains allowed)
# Lines are split on the first two " | ", so a regex may contain "|".
# Every entry needs an "# example: <json tool_input>" comment on the line
# directly above it. The tests use it as a call that must match the entry.
# Every <tool> must also appear in the matcher of .kiro/hooks/risky-tool-guard.json.
# Run scripts/validate.sh after changing this file.

# example: {"targetFile": "src/old_module.py"}
delete_file | File deletion | *

# example: {"url": "https://example.com/data.json"}
web_fetch | Network fetch to a host not on the allowlist | host-not-in url docs.aws.amazon.com kiro.dev pypi.org github.com

# example: {"command": "cdk deploy --all"}
execute_bash | Deploy or publish command | regex command (?i)\b(cdk deploy|sam deploy|terraform apply|serverless deploy|kubectl apply|helm (install|upgrade)|npm publish|twine upload)\b

# example: {"command": "terraform apply -auto-approve"}
control_bash_process | Deploy or publish command in a background process | regex command (?i)\b(cdk deploy|sam deploy|terraform apply|serverless deploy|kubectl apply|helm (install|upgrade)|npm publish|twine upload)\b

# example: {"command": "npm publish"}
execute_pwsh | Deploy or publish command | regex command (?i)\b(cdk deploy|sam deploy|terraform apply|kubectl apply|npm publish)\b

# example: {"command": "rm build/output.log"}
execute_bash | Shell file deletion | regex command (?i)(^|[;&|\s])rm\s

# example: {"command": "Remove-Item build -Recurse"}
execute_pwsh | Shell file deletion | regex command (?i)\b(Remove-Item|del|rd|rmdir)\b

# example: {"repo_path": ".", "mode": "hard"}
@git/git_reset | Git history change through MCP | *

# example: {"repo_path": ".", "message": "wip"}
@git/git_commit | Git commit through MCP | *

# example: {"repo_path": ".", "branch_name": "main"}
@git/git_checkout | Git checkout through MCP | *
